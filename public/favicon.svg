<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="subroutine-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="subroutine-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="128" fill="url(#subroutine-bg)" stroke="#1e293b" stroke-width="16" />

  <!-- Inner Outer Glow Ring -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#subroutine-accent)" stroke-width="12" opacity="0.4" />

  <!-- Subroutine Call Arrow & Function Glyph -->
  <g filter="url(#glow)">
    <!-- Function Return Loop Arrow -->
    <path d="M 140 330 L 140 210 Q 140 150 200 150 L 320 150 Q 370 150 370 200 Q 370 250 320 250 L 220 250" fill="none" stroke="url(#subroutine-accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Arrowhead -->
    <path d="M 255 215 L 210 250 L 255 285" fill="none" stroke="url(#subroutine-accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Pulse Node Point -->
    <circle cx="140" cy="330" r="28" fill="#06b6d4" />
    <circle cx="320" cy="360" r="22" fill="#10b981" />
    
    <!-- Forward Call Branch -->
    <path d="M 140 330 L 320 360" stroke="url(#subroutine-accent)" stroke-width="24" stroke-dasharray="16 12" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
